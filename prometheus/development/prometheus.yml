global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "django"
    static_configs:
      - targets: ["web:8000"]
        labels:
            environment: development

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
            environment: development

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
            environment: development