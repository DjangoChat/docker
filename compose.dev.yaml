volumes:
  stripe-config: {}
  stripe-secrets: {}

services:
  web:
    build:
      context: ..
      dockerfile: ./docker/config/django/development/Dockerfile
    entrypoint: ["/entrypoint.sh"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ../backend:/app/backend
      - static_volume:/app/backend/src/mediafields
      - stripe-secrets:/stripe-secrets
    ports:
      - "8000:8000"
    env_file:
      - ./env/django.env
      - ./env/postgresql.env
      - ./env/rabbitmq.env
      - ./env/redis.env
      - ./env/stripe.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      stripe-cli:
        condition: service_healthy

  frontend:
    container_name: platoform_react
    build:
      context: ..
      dockerfile: ./docker/config/react/development/Dockerfile
    ports:
      - "5173:80"

  db:
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    env_file:
      - ./env/django.env
      - ./env/postgresql.env
      - ./env/rabbitmq.env
      - ./env/redis.env

  redis:
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - ./env/redis.env

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    env_file:
      - ./env/rabbitmq.env

  celery-worker:
    image: platoform-django-dev
    build:
      context: ..
      dockerfile: ./docker/config/django/development/Dockerfile
    entrypoint: ["/entrypoint-worker.sh"]
    volumes:
      - ../backend:/app/backend
      - static_volume:/app/backend/src/mediafields
      - stripe-secrets:/stripe-secrets
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "active"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    env_file:
      - ./env/django.env
      - ./env/postgresql.env
      - ./env/rabbitmq.env
      - ./env/redis.env
      - ./env/stripe.env

  celery-beat:
    image: platoform-django-dev
    build:
      context: ..
      dockerfile: ./docker/config/django/development/Dockerfile
    entrypoint: ["/entrypoint-beat.sh"]
    volumes:
      - ../backend:/app/backend
      - static_volume:/app/backend/src/mediafields
      - stripe-secrets:/stripe-secrets
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "active"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    env_file:
      - ./env/django.env
      - ./env/postgresql.env
      - ./env/rabbitmq.env
      - ./env/redis.env
      - ./env/stripe.env

  flower:
    image: platoform-django-dev
    build:
      context: ..
      dockerfile: ./docker/config/django/development/Dockerfile
    entrypoint: ["/entrypoint-flower.sh"]
    ports:
      - "5555:5555"
    volumes:
      - ../backend:/app/backend
      - static_volume:/app/backend/src/mediafields
    env_file:
      - ./env/django.env
      - ./env/postgresql.env
      - ./env/rabbitmq.env
      - ./env/redis.env
      - ./env/stripe.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  stripe-cli:
    build:
      context: ..
      dockerfile: ./docker/config/stripe/development/Dockerfile
    volumes:
      - stripe-config:/root/.config/stripe/
      - stripe-secrets:/stripe-secrets
    env_file:
      - ./env/stripe.env
    networks:
      - platform
    healthcheck:
      test: ["CMD", "pgrep", "-x", "stripe"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
