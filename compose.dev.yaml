volumes:
  stripe-config: {}
  stripe-secrets: {}
  hf-cache: {}
  ollama_models: {}
  langfuse_postgres_data: {}
  langfuse_clickhouse_data: {}
  langfuse_clickhouse_logs: {}
  langfuse_minio_data: {}

services:
  web:
    build:
      context: ..
      dockerfile: ./docker/config/django/development/Dockerfile
    entrypoint: ["/entrypoint.sh"]
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ../backend:/app/backend
      - static_volume:/app/backend/src/mediafields
      - stripe-secrets:/stripe-secrets
    ports:
      - "8000:8000"
    env_file:
      - ./env/django.env
      - ./env/postgresql.env
      - ./env/rabbitmq.env
      - ./env/redis.env
      - ./env/stripe.env
      - ./env/langfuse.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      stripe-cli:
        condition: service_healthy
      ollama:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy

  frontend:
    container_name: platoform_react
    build:
      context: ..
      dockerfile: ./docker/config/react/development/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app/frontend
      - /app/frontend/node_modules

  db:
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/development/init-langfuse.sql:/docker-entrypoint-initdb.d/init-langfuse.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    env_file:
      - ./env/django.env
      - ./env/postgresql.env
      - ./env/rabbitmq.env
      - ./env/redis.env

  redis:
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    entrypoint: ["sh", "-c"]
    command:
      [
        'redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory-policy noeviction',
      ]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --raw incr ping']
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - ./env/redis.env

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    env_file:
      - ./env/rabbitmq.env

  celery-worker:
    image: platoform-django-dev
    build:
      context: ..
      dockerfile: ./docker/config/django/development/Dockerfile
    entrypoint: ["/entrypoint-worker.sh"]
    mem_limit: 512m
    volumes:
      - ../backend:/app/backend
      - static_volume:/app/backend/src/mediafields
      - stripe-secrets:/stripe-secrets
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "active"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    env_file:
      - ./env/django.env
      - ./env/postgresql.env
      - ./env/rabbitmq.env
      - ./env/redis.env
      - ./env/stripe.env

  celery-worker-ml:
    image: platoform-django-dev
    build:
      context: ..
      dockerfile: ./docker/config/django/development/Dockerfile
    entrypoint: ["/entrypoint-worker-ml.sh"]
    mem_limit: 3g
    volumes:
      - ../backend:/app/backend
      - static_volume:/app/backend/src/mediafields
      - stripe-secrets:/stripe-secrets
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "active"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    env_file:
      - ./env/django.env
      - ./env/postgresql.env
      - ./env/rabbitmq.env
      - ./env/redis.env
      - ./env/stripe.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery-beat:
    image: platoform-django-dev
    build:
      context: ..
      dockerfile: ./docker/config/django/development/Dockerfile
    entrypoint: ["/entrypoint-beat.sh"]
    volumes:
      - ../backend:/app/backend
      - static_volume:/app/backend/src/mediafields
      - stripe-secrets:/stripe-secrets
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "active"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    env_file:
      - ./env/django.env
      - ./env/postgresql.env
      - ./env/rabbitmq.env
      - ./env/redis.env
      - ./env/stripe.env

  flower:
    image: platoform-django-dev
    build:
      context: ..
      dockerfile: ./docker/config/django/development/Dockerfile
    entrypoint: ["/entrypoint-flower.sh"]
    ports:
      - "5555:5555"
    volumes:
      - ../backend:/app/backend
      - static_volume:/app/backend/src/mediafields
    env_file:
      - ./env/django.env
      - ./env/postgresql.env
      - ./env/rabbitmq.env
      - ./env/redis.env
      - ./env/stripe.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  stripe-cli:
    build:
      context: ..
      dockerfile: ./docker/config/stripe/development/Dockerfile
    volumes:
      - stripe-config:/root/.config/stripe/
      - stripe-secrets:/stripe-secrets
    env_file:
      - ./env/stripe.env
    networks:
      - platform
    healthcheck:
      test: ["CMD", "pgrep", "-x", "stripe"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  ollama:
    image: ollama/ollama:latest
    container_name: platform_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    env_file:
      - ./env/ollama.env
    networks:
      - platform
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: platform_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
      - "9009:9009"
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: changeme
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - platform

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: platform_minio
    ports:
      - "9090:9000"
      - "9001:9001"
    volumes:
      - langfuse_minio_data:/data
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - platform

  langfuse-web:
    image: ghcr.io/langfuse/langfuse:latest
    container_name: platform_langfuse_web
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    env_file:
      - ./env/langfuse.env
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/public/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - platform

  langfuse-worker:
    image: ghcr.io/langfuse/langfuse-worker:latest
    container_name: platform_langfuse_worker
    environment:
      NODE_ENV: development
      PORT: "3030"
    env_file:
      - ./env/langfuse.env
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      langfuse-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3030/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - platform
