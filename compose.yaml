networks:
  platform:
    driver: bridge

volumes:
  static_volume: {}
  postgres_data: {}
  redis_data: {}
  hf-cache: {}
  langfuse_postgres_data: {}
  langfuse_clickhouse_data: {}
  langfuse_clickhouse_logs: {}
  langfuse_minio_data: {}

services:
  web:
    container_name: platform_django
    networks:
      - platform

  frontend:
    container_name: platform_react
    networks:
      - platform

  db:
    image: pgvector/pgvector:pg16
    container_name: platform_postgresql
    networks:
      - platform

  redis:
    image: redis:7
    container_name: platform_redis
    networks:
      - platform

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: platform_rabbitmq
    networks:
      - platform

  celery-worker:
    container_name: platform_celery_worker
    networks:
      - platform

  celery-worker-ml:
    container_name: platform_celery_worker_ml
    networks:
      - platform

  celery-beat:
    container_name: platform_celery_beat
    networks:
      - platform

  flower:
    image: mher/flower:latest
    container_name: platform_flower
    networks:
      - platform

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: platform_clickhouse
    networks:
      - platform

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: platform_minio
    networks:
      - platform

  langfuse-web:
    image: ghcr.io/langfuse/langfuse:latest
    container_name: platform_langfuse_web
    networks:
      - platform

  langfuse-worker:
    image: ghcr.io/langfuse/langfuse-worker:latest
    container_name: platform_langfuse_worker
    networks:
      - platform
